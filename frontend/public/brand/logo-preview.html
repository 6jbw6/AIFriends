<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI Friends Logo</title>
<style>
  :root { --brand1:#6366f1; --brand2:#8b5cf6; --brand3:#ec4899; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f0f14; color:#e5e5ee; padding:48px; }
  h1 { font-size:20px; font-weight:600; margin-bottom:8px; color:#a5a5c0; }
  .sub { color:#66667a; font-size:13px; margin-bottom:40px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-bottom:48px; }
  .card { background:#1a1a24; border:1px solid #26263a; border-radius:20px; padding:36px 24px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .card.light { background:#f4f4f8; border-color:#e0e0ea; }
  .label { font-size:12px; color:#66667a; letter-spacing:.5px; text-transform:uppercase; }
  .card.light .label { color:#9a9ab0; }
  .row { display:flex; align-items:center; gap:32px; flex-wrap:wrap; justify-content:center; }
  .lockup { display:flex; align-items:center; gap:14px; }
  .wordmark { font-size:30px; font-weight:700; letter-spacing:-.5px; }
  .wordmark .ai { background:linear-gradient(135deg,var(--brand1),var(--brand3)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card.light .wordmark { color:#1a1a24; }
  .favrow { display:flex; gap:16px; align-items:flex-end; }
  .favrow .fav { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .favrow .fav span { font-size:10px; color:#66667a; }
  h2 { font-size:14px; color:#8888a0; margin:32px 0 16px; font-weight:600; }
</style>
</head>
<body>
<h1>AI Friends — Logo 方案</h1>
<div class="sub">矢量 SVG · 渐变紫粉品牌色 · 聊天气泡 + 友好伙伴意象</div>

<h2>方案 A — 双气泡笑脸（推荐）</h2>
<div class="grid">
  <div class="card">
    <div class="label">图标 · 深色</div>
    <div id="markA"></div>
  </div>
  <div class="card light">
    <div class="label">图标 · 浅色</div>
    <div id="markAL"></div>
  </div>
  <div class="card">
    <div class="label">横向组合</div>
    <div class="lockup"><div id="markAsm"></div><div class="wordmark"><span class="ai">AI</span> Friends</div></div>
  </div>
</div>

<h2>方案 B — 对话气泡里的 AI 火花</h2>
<div class="grid">
  <div class="card">
    <div class="label">图标 · 深色</div>
    <div id="markB"></div>
  </div>
  <div class="card light">
    <div class="label">图标 · 浅色</div>
    <div id="markBL"></div>
  </div>
  <div class="card">
    <div class="label">横向组合</div>
    <div class="lockup"><div id="markBsm"></div><div class="wordmark"><span class="ai">AI</span> Friends</div></div>
  </div>
</div>

<h2>方案 C — 两个伙伴（连体气泡）</h2>
<div class="grid">
  <div class="card">
    <div class="label">图标 · 深色</div>
    <div id="markC"></div>
  </div>
  <div class="card light">
    <div class="label">图标 · 浅色</div>
    <div id="markCL"></div>
  </div>
  <div class="card">
    <div class="label">横向组合</div>
    <div class="lockup"><div id="markCsm"></div><div class="wordmark"><span class="ai">AI</span> Friends</div></div>
  </div>
</div>

<h2>Favicon 尺寸预览（方案 A）</h2>
<div class="card" style="align-items:flex-start;">
  <div class="favrow">
    <div class="fav"><div id="fav64"></div><span>64px</span></div>
    <div class="fav"><div id="fav32"></div><span>32px</span></div>
    <div class="fav"><div id="fav16"></div><span>16px</span></div>
  </div>
</div>

<script>
// ---------- 方案 A: 双气泡笑脸 ----------
function markA(size, dark=true) {
  const eye = dark ? '#fff' : '#fff';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gA${size}${dark}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <path d="M20 14 h60 a14 14 0 0 1 14 14 v34 a14 14 0 0 1 -14 14 h-30 l-18 16 a3 3 0 0 1 -5 -2.3 v-13.7 h-7 a14 14 0 0 1 -14 -14 v-34 a14 14 0 0 1 14 -14 z" fill="url(#gA${size}${dark})"/>
  <circle cx="38" cy="44" r="6" fill="${eye}"/>
  <circle cx="62" cy="44" r="6" fill="${eye}"/>
  <path d="M36 58 q14 12 28 0" fill="none" stroke="${eye}" stroke-width="5" stroke-linecap="round"/>
</svg>`;
}
// ---------- 方案 B: 气泡里的 AI 火花 ----------
function markB(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gB${size}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <path d="M18 12 h64 a13 13 0 0 1 13 13 v40 a13 13 0 0 1 -13 13 h-34 l-20 17 a3 3 0 0 1 -5 -2.3 v-14.7 h-5 a13 13 0 0 1 -13 -13 v-40 a13 13 0 0 1 13 -13 z" fill="url(#gB${size})"/>
  <path d="M50 26 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#fff"/>
  <circle cx="74" cy="30" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="28" cy="60" r="3" fill="#fff" opacity="0.75"/>
</svg>`;
}
// ---------- 方案 C: 连体气泡（两个伙伴） ----------
function markC(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gC1${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="gC2${size}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  </defs>
  <path d="M14 20 h44 a12 12 0 0 1 12 12 v20 a12 12 0 0 1 -12 12 h-24 l-14 12 a2.5 2.5 0 0 1 -4 -2 v-10 h-2 a12 12 0 0 1 -12 -12 v-20 a12 12 0 0 1 12 -12 z" fill="url(#gC1${size})"/>
  <path d="M52 40 h34 a12 12 0 0 1 12 12 v20 a12 12 0 0 1 -12 12 h-2 v10 a2.5 2.5 0 0 1 -4 2 l-14 -12 h-14 a12 12 0 0 1 -12 -12 v-20 a12 12 0 0 1 12 -12 z" fill="url(#gC2${size})"/>
  <circle cx="27" cy="42" r="4.5" fill="#fff"/><circle cx="45" cy="42" r="4.5" fill="#fff"/>
  <circle cx="66" cy="62" r="4.5" fill="#fff"/><circle cx="84" cy="62" r="4.5" fill="#fff"/>
</svg>`;
}
document.getElementById('markA').innerHTML = markA(120);
document.getElementById('markAL').innerHTML = markA(120,false);
document.getElementById('markAsm').innerHTML = markA(52);
document.getElementById('markB').innerHTML = markB(120);
document.getElementById('markBL').innerHTML = markB(120);
document.getElementById('markBsm').innerHTML = markB(52);
document.getElementById('markC').innerHTML = markC(120);
document.getElementById('markCL').innerHTML = markC(120);
document.getElementById('markCsm').innerHTML = markC(52);
document.getElementById('fav64').innerHTML = markA(64);
document.getElementById('fav32').innerHTML = markA(32);
document.getElementById('fav16').innerHTML = markA(16);
</script>
</body>
</html>
